<script>

    { id: "buyers",   label: "Buyer name(s)",    type: "text", value: "Priya Natarajan", source: "Purchase Agreement", required: true },

  questions: [
    { id: "coordination", label: "How much coordination do you want on this file?", type: "choice", options: ["Full coordination", "Compliance only"], required: true,

        { id: "inspection", label: "Inspection date (if scheduled)", type: "date", required: false }

      ]}},
    { id: "referral", label: "Is there a referral fee on this transaction?", type: "choice", options: ["Yes", "No"], required: true,

        { id: "referral_amount",    label: "Referral fee amount", type: "text", required: true },
        { id: "referral_agent",     label: "Referring agent name", type: "text", required: true },
        { id: "referral_brokerage", label: "Referring brokerage", type: "text", required: true }
      ]}},

  ],
  stats: { asked: 4, instead: 24 },
